[package]
name = "domtree"
version = "2.0.0"
edition = "2021"
authors = ["MTX"]
description = "Fast Rust CLI for rendering and analyzing HTML DOM trees"
license = "MIT"
repository = "https://github.com/MTX/domtree"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
termcolor = "1.4"
